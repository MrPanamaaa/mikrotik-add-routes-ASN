<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница-заглушка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a1a;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(53, 194, 70, 0.15), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(5, 132, 3, 0.1), transparent 50%);
            color: #e0e0e0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(53, 194, 70, 0.5));
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #a0a0a0;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(53, 194, 70, 0.1);
            border: 1px solid rgba(53, 194, 70, 0.3);
            border-radius: 50px;
            font-size: 0.9rem;
            color: #35c246;
            margin-bottom: 40px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #35c246;
            border-radius: 50%;
            box-shadow: 0 0 10px #35c246;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .badge-wrapper {
            display: flex;
            justify-content: center;
            margin: 40px 0;
            overflow-x: auto;
            padding: 10px;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
        }

        .footer a {
            color: #35c246;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #4ae05c;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
            .logo { font-size: 48px; }
            .badge-wrapper img { width: 100% !important; height: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛡️</div>

        <h1>Страница-заглушка</h1>

        <p class="subtitle">
            Данный раздел находится в разработке.<br>
            Пожалуйста, зайдите позже.
        </p>

        <div class="status">
            <span class="status-dot"></span>
            <span>Сайт работает</span>
        </div>

        <div class="badge-wrapper">
            <a href="https://www.abuseipdb.com/user/361940" title="AbuseIPDB is an IP address blacklist for webmasters and sysadmins to report IP addresses engaging in abusive behavior on their networks">
                <img src="https://www.abuseipdb.com/contributor/361940.svg?theme=dark" alt="AbuseIPDB Contributor Badge" style="width: 782px;border-radius: 5px; border-top: 5px solid #058403; border-right: 5px solid #111; border-bottom: 5px solid #111; border-left: 5px solid #058403; padding: 5px;background: #35c246 linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.3) 50%, rgba(0,0,0,.2) 51%, rgba(0,0,0,0)); padding: 5px;box-shadow: 2px 2px 1px 1px rgba(0, 0, 0, .2);">
            </a>
        </div>

        <div class="footer">
            <p>Мы боремся с вредоносным трафиком и помогаем защищать интернет.</p>
            <p>© <span id="year"></span> Все права защищены.</p>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
